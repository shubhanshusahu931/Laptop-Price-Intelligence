<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaptopPredict — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#040813;--card:#0d1525;--border:#1a2840;--text:#e8f0fe;--text2:#7a9cc0;--accent:#f5a623;--accent2:#3d8ef8;--green:#00e5a0;--red:#ff4d6d;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
h1,h2,.logo{font-family:'Syne',sans-serif;}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
.wrap{position:relative;z-index:1;width:100%;max-width:430px;padding:20px;}
.login-card{
  background:var(--card);border:1px solid var(--border);border-radius:28px;padding:44px 40px;
  box-shadow:0 40px 80px rgba(0,0,0,.6);
}
.logo{font-size:26px;font-weight:800;color:var(--accent);text-align:center;margin-bottom:6px;}
.tagline{text-align:center;font-size:14px;color:var(--text2);margin-bottom:32px;}
.tabs{display:flex;background:rgba(255,255,255,.04);border-radius:12px;padding:4px;margin-bottom:28px;}
.tab{flex:1;padding:10px;text-align:center;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;color:var(--text2);transition:.2s;}
.tab.active{background:linear-gradient(135deg,#f5a623,#e8901a);color:#fff;}
.form-section{display:none;} .form-section.active{display:block;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:7px;}
.field-wrap{position:relative;}
.field input{
  width:100%;padding:12px 16px;border-radius:12px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;
  transition:.2s;outline:none;
}
.field input:focus{border-color:var(--accent2);background:rgba(61,142,248,.05);box-shadow:0 0 0 3px rgba(61,142,248,.1);}
.field .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:13px;}
.field input.has-icon{padding-left:38px;}
.submit-btn{
  width:100%;padding:13px;border-radius:12px;
  background:linear-gradient(135deg,#f5a623,#e8901a);
  color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;
  font-family:'DM Sans',sans-serif;transition:all .25s;margin-top:6px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(245,166,35,.35);}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
.err{color:var(--red);font-size:13px;margin-top:12px;text-align:center;min-height:18px;}
.back-link{display:block;text-align:center;margin-top:24px;color:var(--text2);font-size:13px;text-decoration:none;}
.back-link:hover{color:var(--accent);}
.back-link span{color:var(--accent2);font-weight:600;}
.saved-accs{margin-bottom:24px;}
.saved-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);margin-bottom:10px;}
.saved-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;border-radius:12px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  cursor:pointer;transition:.2s;margin-bottom:8px;
}
.saved-item:hover{border-color:var(--accent2);background:rgba(61,142,248,.05);}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;}
.saved-info{flex:1;}
.saved-name{font-size:14px;font-weight:600;}
.saved-email{font-size:11px;color:var(--text2);}
.saved-arrow{color:var(--text2);font-size:12px;}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text2);font-size:12px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="wrap">
  <div class="login-card">
    <div class="logo">💻 LaptopPredict</div>
    <div class="tagline">AI-powered laptop price intelligence</div>

    <!-- Saved accounts if any -->
    <div class="saved-accs" id="savedAccs" style="display:none">
      <div class="saved-title">Saved Accounts</div>
      <div id="savedList"></div>
      <div class="divider">or sign in with another account</div>
    </div>

    <div class="tabs">
      <div class="tab active" id="t1" onclick="switchTab('login')">Login</div>
      <div class="tab" id="t2" onclick="switchTab('register')">Register</div>
    </div>

    <!-- LOGIN -->
    <div class="form-section active" id="loginSec">
      <div class="field">
        <label>Username or Email</label>
        <div class="field-wrap">
          <i class="fa fa-user icon"></i>
          <input type="text" id="li" class="has-icon" placeholder="Username or email" autocomplete="username">
        </div>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="field-wrap">
          <i class="fa fa-lock icon"></i>
          <input type="password" id="lp" class="has-icon" placeholder="Enter password" autocomplete="current-password">
        </div>
      </div>
      <button class="submit-btn" id="loginBtn" onclick="doLogin()">
        <i class="fa fa-sign-in-alt"></i> Login
      </button>
    </div>

    <!-- REGISTER -->
    <div class="form-section" id="registerSec">
      <div class="field">
        <label>Username</label>
        <div class="field-wrap">
          <i class="fa fa-user icon"></i>
          <input type="text" id="ru" class="has-icon" placeholder="Choose a username">
        </div>
      </div>
      <div class="field">
        <label>Email</label>
        <div class="field-wrap">
          <i class="fa fa-envelope icon"></i>
          <input type="email" id="re" class="has-icon" placeholder="Enter your email">
        </div>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="field-wrap">
          <i class="fa fa-lock icon"></i>
          <input type="password" id="rp" class="has-icon" placeholder="Min 6 characters">
        </div>
      </div>
      <button class="submit-btn" id="regBtn" onclick="doRegister()">
        <i class="fa fa-user-plus"></i> Create Account
      </button>
    </div>

    <div class="err" id="err"></div>
    <a href="/" class="back-link">← Back to <span>Home</span></a>
  </div>
</div>

<script>
// Canvas particles
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let W,H,pts=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
rs(); window.addEventListener('resize',rs);
for(let i=0;i<80;i++) pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*2+.5,a:Math.random()*.4+.1,c:['#f5a623','#3d8ef8','#00e5a0'][Math.floor(Math.random()*3)]});
function frame(){
  cx.clearRect(0,0,W,H);
  pts.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);
    cx.fillStyle=p.c;cx.globalAlpha=p.a;cx.fill();cx.globalAlpha=1;
  });
  requestAnimationFrame(frame);
}
frame();

// Saved accounts
const saved = JSON.parse(localStorage.getItem('lp_accounts')||'[]');
if(saved.length) {
  document.getElementById('savedAccs').style.display='block';
  document.getElementById('savedList').innerHTML = saved.map(a=>`
    <div class="saved-item" onclick="quickLogin('${a.token}','${a.username}')">
      <div class="avatar" style="background:${a.color||'#f5a623'}">${a.username.substring(0,2).toUpperCase()}</div>
      <div class="saved-info"><div class="saved-name">${a.username}</div><div class="saved-email">${a.email||''}</div></div>
      <i class="fa fa-chevron-right saved-arrow"></i>
    </div>`).join('');
}

async function quickLogin(token, username) {
  // Verify token is still valid
  const r = await fetch('/auth/me', {headers:{'Authorization':'Bearer '+token}}).catch(()=>null);
  if(r && r.ok) {
    localStorage.setItem('lp_token', token);
    location.href = '/app';
  } else {
    // Token expired, remove from saved
    const accs = saved.filter(a=>a.token!==token);
    localStorage.setItem('lp_accounts', JSON.stringify(accs));
    setErr('Session expired for '+username+'. Please login again.');
  }
}

function switchTab(tab) {
  document.getElementById('t1').classList.toggle('active', tab==='login');
  document.getElementById('t2').classList.toggle('active', tab==='register');
  document.getElementById('loginSec').classList.toggle('active', tab==='login');
  document.getElementById('registerSec').classList.toggle('active', tab==='register');
  setErr('');
}

function setErr(msg){ document.getElementById('err').textContent=msg; }
function setLoading(id,loading){ const b=document.getElementById(id); b.disabled=loading; b.innerHTML=loading?'<i class="fa fa-spinner fa-spin"></i> Please wait...':b.id==='loginBtn'?'<i class="fa fa-sign-in-alt"></i> Login':'<i class="fa fa-user-plus"></i> Create Account'; }

async function doLogin(){
  const id=document.getElementById('li').value.trim();
  const pw=document.getElementById('lp').value;
  if(!id||!pw){setErr('Please fill all fields');return;}
  setLoading('loginBtn',true);
  try{
    const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:id,password:pw})});
    const d=await r.json();
    if(d.error){setErr(d.error);return;}
    saveAndGo(d);
  }catch(e){setErr('Cannot connect to server. Make sure app is running.');}
  finally{setLoading('loginBtn',false);}
}

async function doRegister(){
  const u=document.getElementById('ru').value.trim();
  const e=document.getElementById('re').value.trim();
  const p=document.getElementById('rp').value;
  if(!u||!e||!p){setErr('Please fill all fields');return;}
  setLoading('regBtn',true);
  try{
    const r=await fetch('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,email:e,password:p})});
    const d=await r.json();
    if(d.error){setErr(d.error);return;}
    saveAndGo(d);
  }catch(e){setErr('Cannot connect to server. Make sure app is running.');}
  finally{setLoading('regBtn',false);}
}

function saveAndGo(data){
  localStorage.setItem('lp_token',data.token);
  const accs=JSON.parse(localStorage.getItem('lp_accounts')||'[]');
  const idx=accs.findIndex(a=>a.username===data.username);
  const acc={username:data.username,email:data.email,color:data.avatar_color,token:data.token};
  if(idx>=0) accs[idx]=acc; else accs.push(acc);
  localStorage.setItem('lp_accounts',JSON.stringify(accs));
  location.href='/app';
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(document.getElementById('loginSec').classList.contains('active')) doLogin();
    else doRegister();
  }
});

// Auto-redirect if already logged in
const tok = localStorage.getItem('lp_token');
if(tok) fetch('/auth/me',{headers:{'Authorization':'Bearer '+tok}}).then(r=>r.ok&&(location.href='/app')).catch(()=>{});
</script>
</body>
</html>
